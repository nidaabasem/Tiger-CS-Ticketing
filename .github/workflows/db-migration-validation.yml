name: DB Migration Validation

# Applies InitialIdentityAndAccess to a real SQL Server (a service container,
# not InMemory/mocked) and verifies the resulting schema — the one check
# this sandbox's own dev environment could not run itself (no Docker
# daemon available there). See docs/DEV-SETUP.md §7 for the equivalent
# manual checklist.
#
# Path-filtered to schema-relevant changes (Infrastructure/Domain code, this
# workflow file itself) so it doesn't re-run on unrelated documentation-only
# changes.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/TigerCS.Infrastructure/**"
      - "src/TigerCS.Domain/**"
      - ".github/workflows/db-migration-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "src/TigerCS.Infrastructure/**"
      - "src/TigerCS.Domain/**"
      - ".github/workflows/db-migration-validation.yml"
  workflow_dispatch: {}

jobs:
  validate-migration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Validation-Only-Passw0rd!"
        ports:
          - 1433:1433
        # No Docker HEALTHCHECK here (two attempts at one — an in-container
        # sqlcmd path guess, then a bash /dev/tcp probe — both left the
        # service stuck "unhealthy" until GitHub Actions gave up and tore
        # the container down before the job's own steps ever ran, even
        # though the container logs showed SQL Server had finished starting
        # each time). Readiness is instead handled by the retry loop in the
        # "Apply migration" step below — the same pattern commonly used for
        # this image in GitHub Actions services, since its healthcheck
        # tooling isn't as predictable across image builds as postgres/mysql's.

    env:
      TIGERCS_DESIGN_TIME_CONNECTION: "Server=localhost,1433;Database=TigerCsTicketing_CI;User Id=sa;Password=Ci-Validation-Only-Passw0rd!;TrustServerCertificate=True;"
      SA_PASSWORD: "Ci-Validation-Only-Passw0rd!"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Restore
        working-directory: src
        run: dotnet restore TigerCS.slnx

      - name: Generate and inspect the idempotent migration SQL script
        working-directory: src
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Senior review item 12 — generated and inspected directly, not
          # just applied via `database update`, so the exact DDL this
          # migration would run against any target database (idempotent:
          # safe to run against a database already at some prior migration)
          # is visible in this job's own log, not just its net effect.
          dotnet ef migrations script --idempotent \
            --project TigerCS.Infrastructure --startup-project TigerCS.Infrastructure \
            -o idempotent-migration.sql
          echo "::group::Idempotent migration script (InitialIdentityAndAccess..AddTicketOperations)"
          cat idempotent-migration.sql
          echo "::endgroup::"

      - name: Upload idempotent migration SQL script
        uses: actions/upload-artifact@v4
        with:
          name: idempotent-migration-sql
          path: src/idempotent-migration.sql
          retention-days: 30

      - name: Apply migrations (all pending — InitialIdentityAndAccess, AddCustomerVerification, AddTicketing, AddTicketOperations, AddSlaAndEscalation)
        working-directory: src
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          # The retry loop is a safety net for the service container's own
          # startup time (SQL Server can take a few seconds after the
          # container is created); it is not a substitute for the Restore
          # step above — dotnet ef's own msbuild invocation needs
          # obj/project.assets.json to already exist and does not
          # implicitly restore it.
          for attempt in $(seq 1 10); do
            if dotnet ef database update \
              --project TigerCS.Infrastructure --startup-project TigerCS.Infrastructure \
              --verbose; then
              exit 0
            fi
            echo "Migration attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::dotnet ef database update did not succeed after 10 attempts (100s)."
          exit 1

      - name: Install sqlcmd
        run: |
          ubuntu_release=$(lsb_release -rs)
          echo "Runner Ubuntu release: $ubuntu_release"
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -sSL "https://packages.microsoft.com/config/ubuntu/${ubuntu_release}/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update -y
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Verify schema — exact table list
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT name FROM sys.tables ORDER BY name;" | sed '/^$/d')
          expected=$(printf '%s\n' \
            "AspNetRoleClaims" "AspNetRoles" "AspNetUserClaims" "AspNetUserLogins" \
            "AspNetUserRoles" "AspNetUserTokens" "AspNetUsers" "Departments" \
            "Employees" "UserDepartmentAssignments" \
            "AuditEntries" "ContactReferences" "UnitReferences" "VerificationSessions" \
            "Categories" "Priorities" "IntakeRecords" "Tickets" \
            "TicketRequesterSnapshots" "TicketStatusHistory" \
            "TicketAssignments" "TicketResolutions" "TicketNotes" \
            "SlaPolicies" "BusinessCalendars" "BusinessCalendarWorkingDays" "Holidays" \
            "TicketSlaInstances" "TicketEscalations" "IdempotencyRecords" \
            "__EFMigrationsHistory" | sort)
          actual_sorted=$(echo "$actual" | sort)
          echo "--- actual tables ---"
          echo "$actual_sorted"
          echo "--- expected tables ---"
          echo "$expected"
          if [ "$actual_sorted" != "$expected" ]; then
            echo "::error::Table list does not match the expected Identity and Access + CRM Verification + Ticketing + SLA and Escalation schema exactly."
            diff <(echo "$expected") <(echo "$actual_sorted") || true
            exit 1
          fi
          echo "Table list matches exactly: 31 tables. TicketSlaPausePeriods and PriorityDowngradeRequests are deliberately absent (MVP-Implementation-Backlog.md §0/§0.2), as are all Genesys tables."

      - name: Verify schema — filtered unique index (one primary department per employee)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'IX_UserDepartmentAssignments_EmployeeId_PrimaryOnly';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([IsPrimary]=(1))" ]; then
            echo "::error::IX_UserDepartmentAssignments_EmployeeId_PrimaryOnly filter_definition was '$filter_trimmed', expected '([IsPrimary]=(1))'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — filtered unique index (CRM verification-session idempotency)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # This is the real, SQL-Server-only enforcement mechanism behind
          # VerificationSessionAppService's DuplicateWriteException recovery
          # path — see VerificationSessionConfiguration's remarks. The EF
          # Core InMemory provider used by the unit/integration test suite
          # does not enforce filtered indexes at all, so this CI check
          # against a real SQL Server is the only place this index's actual
          # existence and shape are verified.
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'IX_VerificationSessions_AgentEmployeeId_IdempotencyKey';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([IdempotencyKey]ISNOTNULL)" ]; then
            echo "::error::IX_VerificationSessions_AgentEmployeeId_IdempotencyKey filter_definition was '$filter_trimmed', expected '([IdempotencyKey]ISNOTNULL)'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — unique index (TicketNumber, FR-TKT-01)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # TicketCreationAppService.GenerateTicketNumberAsync computes a
          # per-department-per-day sequence from a COUNT query, then relies
          # on this unique index as the real correctness backstop under
          # concurrency (a collision surfaces as DuplicateWriteException via
          # TicketingUnitOfWork, same translation pattern as the two checks
          # above). The EF Core InMemory provider does not enforce unique
          # indexes under concurrent writes (see CustomerVerificationUnitOfWork's
          # remarks) — this is the only place its real existence is verified.
          is_unique=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT is_unique FROM sys.indexes WHERE object_id = OBJECT_ID('Tickets') AND name = 'IX_Tickets_TicketNumber';")
          is_unique_trimmed=$(echo "$is_unique" | tr -d '[:space:]')
          echo "is_unique = '$is_unique_trimmed'"
          if [ "$is_unique_trimmed" != "1" ]; then
            echo "::error::IX_Tickets_TicketNumber is not a unique index (is_unique='$is_unique_trimmed')."
            exit 1
          fi
          echo "Unique index present on Tickets.TicketNumber."

      - name: Verify schema — filtered unique index (one current assignment per ticket)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Backs TicketAssignmentAppService.AssignAsync's history model
          # (MVP-Data-Dictionary.md §2.12: "exactly one true row per
          # TicketId") — the real, SQL-Server-only enforcement the InMemory
          # provider used by the test suite cannot verify.
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'IX_TicketAssignments_TicketId';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([IsCurrent]=(1))" ]; then
            echo "::error::IX_TicketAssignments_TicketId filter_definition was '$filter_trimmed', expected '([IsCurrent]=(1))'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — filtered unique index (one current resolution per ticket)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Backs TicketLifecycleAppService.CloseAsync's "cannot close
          # without a current resolution" gate (MVP-ERD.md §2.14).
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'IX_TicketResolutions_TicketId';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([IsCurrent]=(1))" ]; then
            echo "::error::IX_TicketResolutions_TicketId filter_definition was '$filter_trimmed', expected '([IsCurrent]=(1))'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — Tickets.RowVersion is a real optimistic-concurrency token
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Backs every assignment/transfer/status-change/resolve/close/
          # reconciliation write's lost-update protection
          # (TicketingUnitOfWork's DbUpdateConcurrencyException translation)
          # — confirms the column is a real SQL Server rowversion, not just
          # an EF Core-side annotation with no database backing.
          data_type=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT DATA_TYPE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = 'Tickets' AND COLUMN_NAME = 'RowVersion';")
          data_type_trimmed=$(echo "$data_type" | tr -d '[:space:]')
          echo "DATA_TYPE = '$data_type_trimmed'"
          if [ "$data_type_trimmed" != "timestamp" ]; then
            echo "::error::Tickets.RowVersion DATA_TYPE was '$data_type_trimmed', expected 'timestamp' (SQL Server's name for rowversion)."
            exit 1
          fi
          echo "Tickets.RowVersion is a real rowversion/timestamp column."

      - name: Verify schema — Tickets/IntakeRecords column nullability (senior review item 12)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Confirms directly against real SQL Server, not just EF's
          # in-memory model, the specific nullability decisions this
          # increment's design review confirmed: UnitReferenceId/
          # ContactReferenceId are nullable (the provisional-ticket
          # relaxation), every other Tickets FK/required field is NOT NULL,
          # and IntakeRecords.RawUnitNumberEntered/PriorityHint/LinkedTicketId
          # are nullable while ChannelId/IsUnitRelated/CrmVerificationStatus/
          # CreatedByEmployeeId are not.
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT TABLE_NAME + '.' + COLUMN_NAME + '=' + IS_NULLABLE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME IN ('Tickets','IntakeRecords') ORDER BY TABLE_NAME, COLUMN_NAME;" | sed '/^$/d' | tr -d ' ')
          echo "--- actual nullability ---"
          echo "$actual"
          expected=$(printf '%s\n' \
            "IntakeRecords.ChannelId=NO" "IntakeRecords.CreatedByEmployeeId=NO" "IntakeRecords.CrmVerificationStatus=NO" \
            "IntakeRecords.IntakeRecordId=NO" "IntakeRecords.IsUnitRelated=NO" "IntakeRecords.LinkedTicketId=YES" \
            "IntakeRecords.PriorityHint=YES" "IntakeRecords.RawUnitNumberEntered=YES" "IntakeRecords.ReceivedAtUtc=NO" \
            "Tickets.AcknowledgementSentAtUtc=YES" "Tickets.CategoryId=NO" "Tickets.ContactReferenceId=YES" \
            "Tickets.CreatedAtUtc=NO" "Tickets.CurrentDepartmentId=NO" "Tickets.CurrentOwnerEmployeeId=YES" \
            "Tickets.DuplicateOfTicketId=YES" "Tickets.EscalationLevel=NO" "Tickets.FirstHumanResponseAtUtc=YES" \
            "Tickets.OriginatingDepartmentId=NO" "Tickets.PriorityId=NO" "Tickets.ReopenCount=NO" \
            "Tickets.RequestSummary=NO" "Tickets.ResolutionOutcome=YES" "Tickets.SlaState=NO" \
            "Tickets.TicketId=NO" "Tickets.TicketNumber=NO" "Tickets.TicketStatus=NO" \
            "Tickets.UnitReferenceId=YES" "Tickets.VerificationStatus=NO" "Tickets.RowVersion=NO" | sort)
          actual_sorted=$(echo "$actual" | sort)
          echo "--- expected nullability ---"
          echo "$expected"
          if [ "$actual_sorted" != "$expected" ]; then
            echo "::error::Tickets/IntakeRecords column nullability does not match the confirmed design exactly."
            diff <(echo "$expected") <(echo "$actual_sorted") || true
            exit 1
          fi
          echo "Column nullability matches the confirmed design exactly (29 columns)."

      - name: Verify schema — TicketAssignments/TicketResolutions/TicketNotes column nullability
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Confirms BR-011 (ResolutionNote mandatory) and the assignment/
          # note actor fields directly against real SQL Server.
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT TABLE_NAME + '.' + COLUMN_NAME + '=' + IS_NULLABLE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME IN ('TicketAssignments','TicketResolutions','TicketNotes') ORDER BY TABLE_NAME, COLUMN_NAME;" | sed '/^$/d' | tr -d ' ')
          echo "--- actual nullability ---"
          echo "$actual"
          expected=$(printf '%s\n' \
            "TicketAssignments.TicketAssignmentId=NO" "TicketAssignments.TicketId=NO" \
            "TicketAssignments.AssignedEmployeeId=NO" "TicketAssignments.AssignedDepartmentId=NO" \
            "TicketAssignments.AssignedAtUtc=NO" "TicketAssignments.AssigningActorEmployeeId=YES" \
            "TicketAssignments.IsCurrent=NO" \
            "TicketResolutions.TicketResolutionId=NO" "TicketResolutions.TicketId=NO" \
            "TicketResolutions.ResolutionOutcome=NO" "TicketResolutions.ResolutionNote=NO" \
            "TicketResolutions.ReasonCode=YES" "TicketResolutions.DuplicateOfTicketId=YES" \
            "TicketResolutions.ResolvingEmployeeId=NO" "TicketResolutions.ResolvedAtUtc=NO" \
            "TicketResolutions.IsCurrent=NO" \
            "TicketNotes.TicketNoteId=NO" "TicketNotes.TicketId=NO" "TicketNotes.NoteText=NO" \
            "TicketNotes.AuthorEmployeeId=NO" "TicketNotes.CreatedAtUtc=NO" | sort)
          actual_sorted=$(echo "$actual" | sort)
          echo "--- expected nullability ---"
          echo "$expected"
          if [ "$actual_sorted" != "$expected" ]; then
            echo "::error::TicketAssignments/TicketResolutions/TicketNotes column nullability does not match the confirmed design exactly."
            diff <(echo "$expected") <(echo "$actual_sorted") || true
            exit 1
          fi
          echo "Column nullability matches the confirmed design exactly (21 columns)."

      - name: Verify schema — foreign keys on new Ticketing tables (senior review item 12)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Every FK from the new tables, and its delete behavior — must all
          # be NO_ACTION (Restrict): this schema never cascades a delete
          # into Tickets/IntakeRecords/history, consistent with the 7-year
          # retention posture carried through every prior architecture
          # document (MVP-ERD.md §3).
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT OBJECT_NAME(parent_object_id) + '->' + OBJECT_NAME(referenced_object_id) + ':' + delete_referential_action_desc FROM sys.foreign_keys WHERE OBJECT_NAME(parent_object_id) IN ('Tickets','IntakeRecords','TicketRequesterSnapshots','TicketStatusHistory','Categories','TicketAssignments','TicketResolutions','TicketNotes') ORDER BY 1;" | sed '/^$/d' | tr -d ' ')
          echo "--- foreign keys (child->parent:delete-action) ---"
          echo "$actual"
          fk_count=$(echo "$actual" | grep -c '.' || true)
          non_no_action=$(echo "$actual" | grep -v ':NO_ACTION$' || true)
          echo "Foreign key count: $fk_count"
          if [ -n "$non_no_action" ]; then
            echo "::error::Found FK(s) with a delete behavior other than NO_ACTION/Restrict:"
            echo "$non_no_action"
            exit 1
          fi
          if [ "$fk_count" -ne 25 ]; then
            echo "::error::Expected exactly 25 foreign keys across Categories/Tickets/TicketRequesterSnapshots/TicketStatusHistory/IntakeRecords/TicketAssignments/TicketResolutions/TicketNotes, found $fk_count."
            exit 1
          fi
          echo "All foreign keys on the new Ticketing tables are NO_ACTION (Restrict), as required."

      - name: Verify schema — filtered unique index (one current SLA period per ticket)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # MVP-ERD.md §2.15 describes "exactly one row per TicketId has
          # PeriodEndAtUtc IS NULL" as app-enforced and recommends this index.
          # Taking the recommendation makes it unbreakable by any future
          # writer (backlog S-14's priority upgrade closes a period and opens
          # a successor), but the EF Core InMemory provider used by the test
          # suite does not enforce filtered indexes at all — so this is the
          # only place the index's real existence and shape are verified.
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'UX_TicketSlaInstances_CurrentPeriodPerTicket';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([PeriodEndAtUtc]ISNULL)" ]; then
            echo "::error::UX_TicketSlaInstances_CurrentPeriodPerTicket filter_definition was '$filter_trimmed', expected '([PeriodEndAtUtc]ISNULL)'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — filtered unique index (one automatic breach escalation per ticket)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # The database backstop behind backlog S-11's "exactly one Level 2
          # escalation, not a repeating one on every subsequent check". The
          # application checks first, but the scheduled deadline job
          # (SLA-Architecture.md §13) and the safety sweep (§14) can both pass
          # that read before either commits — this index is what makes the
          # loser fail rather than duplicate. Filtered to TriggerType = 1
          # (AutoBreach) so a ticket may still carry several manual
          # escalations as it moves up the Level 1-4 hierarchy.
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'UX_TicketEscalations_OneAutoBreachPerTicket';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([TriggerType]=(1))" ]; then
            echo "::error::UX_TicketEscalations_OneAutoBreachPerTicket filter_definition was '$filter_trimmed', expected '([TriggerType]=(1))'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — unique index (SLA breach idempotency key, ADR-0014)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # SLA-Architecture.md §15's guarantee rests on this index: the
          # scheduled job, the sweep and the two achievement events all claim
          # the same TicketId + CheckType + DueTimestamp key, and exactly one
          # survives the insert. Without it, idempotency would hold only for
          # sequential retries, not for the concurrent case it exists for.
          is_unique=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT is_unique FROM sys.indexes WHERE object_id = OBJECT_ID('IdempotencyRecords') AND name = 'UX_IdempotencyRecords_IdempotencyKey';")
          is_unique_trimmed=$(echo "$is_unique" | tr -d '[:space:]')
          echo "is_unique = '$is_unique_trimmed'"
          if [ "$is_unique_trimmed" != "1" ]; then
            echo "::error::UX_IdempotencyRecords_IdempotencyKey is not a unique index (is_unique='$is_unique_trimmed')."
            exit 1
          fi
          echo "Unique index present on IdempotencyRecords.IdempotencyKey."

      - name: Verify schema — CHECK constraints on the SLA and Escalation tables
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # CHECK constraints are not enforced by the EF Core InMemory
          # provider either, so this is the only place they are verified.
          # CK_TicketEscalations_Level4IsManualOnly is the load-bearing one:
          # Level 4 is manual-only (Solution-Analysis.md §7.6), and because
          # Level and TriggerType arrive as two independent client-supplied
          # fields, the rule has to survive any future writer rather than
          # resting on one application check. The CS-Manager/GM role gate
          # stays app-level, as MVP-ERD.md §2.17 says, since the database has
          # no concept of a role.
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT name FROM sys.check_constraints WHERE OBJECT_NAME(parent_object_id) IN ('SlaPolicies','BusinessCalendars','BusinessCalendarWorkingDays','TicketSlaInstances','TicketEscalations') ORDER BY name;" | sed '/^$/d' | tr -d ' ')
          expected=$(printf '%s\n' \
            "CK_BusinessCalendarWorkingDays_DayOfWeekRange" \
            "CK_BusinessCalendars_WindowOrder" \
            "CK_SlaPolicies_PositiveTargets" \
            "CK_TicketEscalations_Level4IsManualOnly" \
            "CK_TicketEscalations_LevelRange" \
            "CK_TicketSlaInstances_DowngradeRequiresApprover" \
            "CK_TicketSlaInstances_PeriodOrder" | sort)
          actual_sorted=$(echo "$actual" | sort)
          echo "--- actual check constraints ---"
          echo "$actual_sorted"
          echo "--- expected check constraints ---"
          echo "$expected"
          if [ "$actual_sorted" != "$expected" ]; then
            echo "::error::CHECK constraints on the SLA and Escalation tables do not match the expected set exactly."
            diff <(echo "$expected") <(echo "$actual_sorted") || true
            exit 1
          fi
          echo "All 7 expected CHECK constraints are present."

      - name: Verify schema — Level 4 escalation is manual-only, enforced by the database
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Asserts what CK_TicketEscalations_Level4IsManualOnly actually
          # says, not merely that a constraint by that name exists.
          #
          # Deliberately a definition check rather than an attempted INSERT:
          # TicketEscalations.TicketId is an FK to Tickets, and on this
          # freshly-migrated database there are no tickets — so a probe row
          # would be rejected by the foreign key regardless of the CHECK, and
          # would report a pass for entirely the wrong reason. The same
          # definition-text approach the filtered-index checks above use.
          #
          # Matched on tokens rather than one exact string because SQL Server
          # re-renders a CHECK expression when it stores it (parenthesisation
          # and operator spacing are normalised); the tokens below are what
          # the rule means, and none of them can be present unless Level 4 is
          # bound to TriggerType 4 in both directions.
          definition=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT definition FROM sys.check_constraints WHERE name = 'CK_TicketEscalations_Level4IsManualOnly';")
          normalized=$(echo "$definition" | tr -d '[:space:]')
          echo "definition = '$normalized'"
          for token in '[Level]=(4)' '[TriggerType]=(4)' '[Level]<>(4)' '[TriggerType]<>(4)'; do
            if ! echo "$normalized" | grep -qF "$token"; then
              echo "::error::CK_TicketEscalations_Level4IsManualOnly does not contain '$token' — Level 4 is no longer bound to the ManualLevel4 trigger in both directions, so the CS-Manager/GM gate on Level 4 is bypassable."
              exit 1
            fi
          done
          echo "Level 4 is bound to the ManualLevel4 trigger in both directions by the database."

      - name: Verify schema — foreign keys on the SLA and Escalation tables
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Same Restrict-everywhere posture as the Ticketing check above
          # (MVP-ERD.md §2.15/§2.17/§2.20: every one of these tables is
          # "Restrict/never deleted" — SLA periods and escalations are
          # permanent history, and ISSUE-023 requires every period a ticket
          # passed through stay reportable).
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT OBJECT_NAME(parent_object_id) + '->' + OBJECT_NAME(referenced_object_id) + ':' + delete_referential_action_desc FROM sys.foreign_keys WHERE OBJECT_NAME(parent_object_id) IN ('SlaPolicies','BusinessCalendarWorkingDays','Holidays','TicketSlaInstances','TicketEscalations') ORDER BY 1;" | sed '/^$/d' | tr -d ' ')
          echo "--- foreign keys (child->parent:delete-action) ---"
          echo "$actual"
          non_no_action=$(echo "$actual" | grep -v ':NO_ACTION$' || true)
          if [ -n "$non_no_action" ]; then
            echo "::error::Found SLA/Escalation FK(s) with a delete behavior other than NO_ACTION/Restrict:"
            echo "$non_no_action"
            exit 1
          fi
          echo "All foreign keys on the SLA and Escalation tables are NO_ACTION (Restrict), as required."

      - name: Verify no schema drift (no-op probe migration)
        working-directory: src
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            --project TigerCS.Infrastructure --startup-project TigerCS.Infrastructure
