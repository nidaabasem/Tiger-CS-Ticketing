name: CI

on:
  push:
    branches: ["main", "design/**", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
        # global.json lives at the repo root, not under src/ (job default
        # working-directory), so this path is relative to the checkout root.

      - name: Restore
        run: dotnet restore TigerCS.slnx

      - name: Build
        run: dotnet build TigerCS.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TigerCS.slnx --no-build --configuration Release
